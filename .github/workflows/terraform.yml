name: "Terraform"

on:
  push:
    branches:
      - "major/**"
      - "minor/**"
      - "patch/**"
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      terraform_action:
        description: "Terraform Action"
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

jobs:
  Terraform:
    name: "Terraform ${{ inputs.terraform_action || 'plan' }} (prd)"
    runs-on: ubuntu-latest
    environment: prd
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_PLATFORM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - name: "Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.3"

      - name: "Azure Login"
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_PLATFORM_SUBSCRIPTION_ID }}

      - name: "Ensure State Container"
        uses: skyhaven-ltd/pipeline-engineering-github-actions/actions/ensure-tfstate-container@6cfa143b42ff464e4101d69c09945db9fac369e5 # v2.0.0
        with:
          storage_account_name: stplatformprduks02
          container_name: ${{ github.event.repository.name }}
          login: "false"

      # The github provider authenticates as the platform GitHub App via
      # app_auth in _providers.tf, fed by these TF_VARs.
      - name: "Fetch Secrets From Key Vault"
        uses: skyhaven-ltd/pipeline-engineering-github-actions/actions/keyvault-secrets@6cfa143b42ff464e4101d69c09945db9fac369e5 # v2.0.0
        with:
          keyvault_name: kv-platform-prd-uks-02
          secrets: |
            TF_VAR_github_app_id=github-platform-gh-app-id
            TF_VAR_github_app_installation_id=github-platform-gh-app-installation-id
            TF_VAR_github_app_pem=github-platform-gh-app-private-key
          login: "false"

      - name: "Terraform Init"
        uses: skyhaven-ltd/pipeline-engineering-github-actions/actions/terraform-backend-init@6cfa143b42ff464e4101d69c09945db9fac369e5 # v2.0.0
        with:
          environment: prd
          working_directory: infra
          platform_subscription_id: ${{ vars.AZURE_PLATFORM_SUBSCRIPTION_ID }}
          container_name: ${{ github.event.repository.name }}

      - name: "Terraform Plan"
        if: inputs.terraform_action == 'plan' || inputs.terraform_action == ''
        run: |
          terraform -chdir=infra plan \
            -var-file="vars/globals.tfvars" \
            -var-file="vars/prd.tfvars"

      - name: "Terraform Apply"
        if: inputs.terraform_action == 'apply'
        run: |
          terraform -chdir=infra apply -auto-approve \
            -var-file="vars/globals.tfvars" \
            -var-file="vars/prd.tfvars"

      - name: "Terraform Destroy"
        if: inputs.terraform_action == 'destroy'
        run: |
          terraform -chdir=infra destroy -auto-approve \
            -var-file="vars/globals.tfvars" \
            -var-file="vars/prd.tfvars"

      # gh needs a minted installation token; the TF_VARs above are only
      # understood by the terraform github provider. The token stays
      # owner-wide because the step links every managed repository.
      - name: "Generate GitHub App Token"
        if: inputs.terraform_action == 'apply'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 # zizmor: ignore[github-app]
        with:
          app-id: ${{ env.TF_VAR_github_app_id }}
          private-key: ${{ env.TF_VAR_github_app_pem }}
          owner: skyhaven-ltd
          permission-organization-projects: write
          permission-metadata: read

      - name: "Link Repositories to Project Board"
        if: inputs.terraform_action == 'apply'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_NUMBER: "1"
          PROJECT_OWNER: skyhaven-ltd
        run: |
          repos=$(terraform -chdir=infra output -json repository_names | jq -r '.[]')
          for repo in $repos; do
            echo "Linking $repo to project $PROJECT_NUMBER..."
            gh project link "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --repo "$repo"
          done

      - name: "Break State Lease"
        if: always()
        uses: skyhaven-ltd/pipeline-engineering-github-actions/actions/break-tfstate-lease@6cfa143b42ff464e4101d69c09945db9fac369e5 # v2.0.0
        with:
          storage_account_name: stplatformprduks02
          container_name: ${{ github.event.repository.name }}
          login: "false"
