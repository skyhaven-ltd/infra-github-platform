name: PR Validation

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  Validate:
    uses: skyhaven-ltd/pipeline-engineering-github-actions/.github/workflows/reusable-terraform.yml@6cfa143b42ff464e4101d69c09945db9fac369e5
    with:
      environments: '["prd"]'
      terraform_version: "1.15.3"
      tf_var_secrets: |
        TF_VAR_github_app_id=platform-github-app-id
        TF_VAR_github_app_installation_id=platform-github-app-installation-id
        TF_VAR_github_app_pem=platform-github-app-private-key
